<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Advertisement</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- RichAds -->
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>


  <style>

    body {
      margin: 0;
      padding: 25px 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .box {
      max-width: 450px;
      margin: 40px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #2196f3;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      line-height: 1.8;
      word-break: break-word;
      white-space: pre-line;
    }

  </style>

</head>


<body>

  <div class="box">

    <h1>🎁 Advertisement</h1>

    <p>
      নিচের button চাপলে একটি Ads video advertisement চালু হবে।
      সফল ভাবে ads দেখলে ৩ টি ক্রেডিট দেয়া হবে।
    </p>

    <button id="ad-button">
      ▶️ Watch Advertisement
    </button>

    <div id="result">
      এখনো কোনো advertisement চালানো হয়নি।
    </div>

  </div>


<script>


// ============================================================
// TELEGRAM
// ============================================================

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


// ============================================================
// GOOGLE APPS SCRIPT URL
// ============================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycby5Uvyac9UfbVXCsmQOcJ30auADUP-7nGrtpkmiGlv9NdLMknyVIlPPxiZjK2KXLvWn/exec";


// ============================================================
// RICHADS
// ============================================================

const richadsController =
  new window.TelegramAdsController();

richadsController.initialize({

  pubId: "994979",

  appId: "8875",

  debug: false

});


// ============================================================
// HTML ELEMENTS
// ============================================================

const button =
  document.getElementById("ad-button");

const result =
  document.getElementById("result");


// ============================================================
// WATCH AD
// ============================================================

button.addEventListener(
  "click",

  async function () {

    button.disabled = true;

    result.innerText =
      "⏳ Advertisement চালু হচ্ছে...";


    try {


      // ------------------------------------------------------
      // SHOW AD
      // ------------------------------------------------------

      const adResult =
        await richadsController
          .triggerInterstitialVideo();


      console.log(
        "RichAds Result:",
        adResult
      );


      // ------------------------------------------------------
      // CHECK AD RESULT
      // ------------------------------------------------------

      if (
        String(adResult).toLowerCase() !==
        "success"
      ) {

        result.innerText =
          "❌ Advertisement সফল হয়নি।";

        button.disabled = false;

        return;

      }


      // ------------------------------------------------------
      // AD SUCCESS
      // ------------------------------------------------------

      result.innerText =
        "⏳ Advertisement সফল হয়েছে।\n" +
        "Telegram verification চলছে...";


      // ------------------------------------------------------
      // TELEGRAM INIT DATA
      // ------------------------------------------------------

      const initData =
        tg.initData;


      if (!initData) {

        result.innerText =
          "❌ Telegram initData পাওয়া যায়নি।";

        button.disabled = false;

        return;

      }


      // ------------------------------------------------------
      // CREATE POST DATA
      // ------------------------------------------------------

      const formData =
        new URLSearchParams();

      formData.append(
        "initData",
        initData
      );

      formData.append(
        "adResult",
        "success"
      );


      console.log(
        "Sending request to GAS..."
      );


      // ------------------------------------------------------
      // SEND TO GOOGLE APPS SCRIPT
      // ------------------------------------------------------

      const response =
        await fetch(

          GAS_URL,

          {

            method: "POST",

            body: formData

          }

        );


      // ------------------------------------------------------
      // CHECK HTTP STATUS
      // ------------------------------------------------------

      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      // ------------------------------------------------------
      // READ RESPONSE AS TEXT FIRST
      // ------------------------------------------------------

      const responseText =
        await response.text();


      console.log(
        "Raw GAS Response:",
        responseText
      );


      if (!responseText) {

        throw new Error(
          "Google Apps Script থেকে empty response এসেছে"
        );

      }


      // ------------------------------------------------------
      // JSON PARSE
      // ------------------------------------------------------

      let data;

      try {

        data =
          JSON.parse(
            responseText
          );

      } catch (jsonError) {

        throw new Error(
          "GAS valid JSON response দেয়নি"
        );

      }


      console.log(
        "GAS Response:",
        data
      );


      // ------------------------------------------------------
      // SERVER ERROR
      // ------------------------------------------------------

      if (!data.ok) {

        result.innerHTML = `

          <b>❌ Verification Failed</b>

          <br><br>

          ${escapeHtml(
            data.error ||
            "Unknown server error"
          )}

        `;

        button.disabled = false;

        return;

      }


      // ------------------------------------------------------
      // SUCCESS
      // ------------------------------------------------------

      result.innerHTML = `

        <b>✅ Advertisement সফল হয়েছে</b>

        <br><br>

        <b>🎁 Reward: +3 Credit</b>

        <br><br>

        <b>Telegram User</b>

        <br><br>

        ID:
        ${escapeHtml(
          String(data.user.id)
        )}

        <br>

        Name:
        ${escapeHtml(
          (
            data.user.first_name ||
            ""
          ) +
          " " +
          (
            data.user.last_name ||
            ""
          )
        )}

        <br>

        Username:
        ${
          data.user.username
            ? "@" +
              escapeHtml(
                data.user.username
              )
            : "নেই"
        }

      `;


    } catch (error) {

  console.error("FULL ERROR:", error);

  result.innerHTML = `

    <b>❌ Connection Error</b>

    <br><br>

    Google Apps-এর সঙ্গে
    যোগাযোগ করা যায়নি।

    <br><br>

    <b>Error name:</b>
    ${escapeHtml(error.name || "Unknown")}

    <br>

    <b>Error message:</b>
    ${escapeHtml(error.message || "Unknown")}

    <br><br>

    <small>
      Browser console-এ FULL ERROR দেখুন।
    </small>

  `;

}


    button.disabled = false;

  }

);


// ============================================================
// BASIC HTML ESCAPE
// ============================================================

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


</script>

</body>
</html>
