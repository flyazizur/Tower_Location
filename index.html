<!DOCTYPE html>

<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Advertisement Test</title>


  <!-- Telegram Mini App -->

  <script
    src="https://telegram.org/js/telegram-web-app.js">
  </script>


  <!-- RichAds -->

  <script
    src="https://richinfo.co/richpartners/telegram/js/tg-ob.js">
  </script>


  <style>

    body {

      margin: 0;

      padding: 25px 20px;

      font-family:
        Arial,
        sans-serif;

      background:
        #f5f5f5;

      text-align:
        center;

    }


    .box {

      max-width:
        450px;

      margin:
        40px auto;

      padding:
        30px 20px;

      background:
        white;

      border-radius:
        20px;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,0.08);

    }


    h1 {

      margin-bottom:
        10px;

    }


    p {

      line-height:
        1.6;

    }


    button {

      width:
        100%;

      padding:
        16px;

      margin-top:
        20px;

      border:
        none;

      border-radius:
        12px;

      background:
        #2196f3;

      color:
        white;

      font-size:
        18px;

      font-weight:
        bold;

      cursor:
        pointer;

    }


    button:disabled {

      opacity:
        0.6;

    }


    #result {

      margin-top:
        25px;

      padding:
        15px;

      border-radius:
        10px;

      background:
        #f1f1f1;

      line-height:
        1.8;

      word-break:
        break-word;

    }

  </style>

</head>


<body>


  <div class="box">


    <h1>
      🎁 Advertisement 
    </h1>


    <p>
      নিচের button চাপলে একটি Ads video advertisement চালু হবে। সফল ভাবে ads দেখলে ৩ টি ক্রেডিট দেয়া হবে। 
    </p>


    <button
      id="ad-button"
    >
      ▶️ Watch Advertisement
    </button>


    <div id="result">

      এখনো কোনো advertisement
      চালানো হয়নি।

    </div>


  </div>


<script>


// =====================================
// Telegram Mini App
// =====================================

const tg =
  window.Telegram.WebApp;


tg.ready();

tg.expand();


// =====================================
// Google Apps Script URL
// =====================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycby5Uvyac9UfbVXCsmQOcJ30auADUP-7nGrtpkmiGlv9NdLMknyVIlPPxiZjK2KXLvWn/exec";


// =====================================
// RichAds Controller
// =====================================

const richadsController =
  new window.TelegramAdsController();


richadsController.initialize({

  pubId:
    "994979",

  appId:
    "8875",

  debug:
    true

});


// =====================================
// HTML Elements
// =====================================

const button =
  document.getElementById(
    "ad-button"
  );


const result =
  document.getElementById(
    "result"
  );


// =====================================
// Advertisement Button
// =====================================

button.addEventListener(
  "click",

  async function() {


    // Disable button

    button.disabled =
      true;


    result.innerText =
      "⏳ Advertisement চালু হচ্ছে...";


    try {


      // =================================
      // Show RichAds Advertisement
      // =================================

      const adResult =
        await
        richadsController
          .triggerInterstitialVideo();


      console.log(
        "RichAds Result:",
        adResult
      );


      // =================================
      // Check Advertisement Result
      // =================================

      if (
        adResult !==
        "success"
      ) {

        result.innerText =
          "❌ Advertisement successful হয়নি।";

        button.disabled =
          false;

        return;

      }


      // =================================
      // Advertisement Success
      // =================================

      result.innerText =
        "⏳ Advertisement সফল হয়েছে।\n" +
        "Telegram User verification চলছে...";


      // =================================
      // Telegram initData
      // =================================

      const initData =
        tg.initData;


      if (!initData) {

        result.innerText =
          "❌ Telegram initData পাওয়া যায়নি।";

        button.disabled =
          false;

        return;

      }


      console.log(
        "Telegram initData received"
      );


      // =================================
      // Send to Google Apps Script
      // =================================

      const response =
        await fetch(

          GAS_URL,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8"

            },

            body:

              "initData=" +
              encodeURIComponent(
                initData
              )

              +

              "&adResult=" +
              encodeURIComponent(
                adResult
              )

          }

        );


      // =================================
      // Read GAS response
      // =================================

      const data =
        await response.json();


      console.log(
        "GAS Response:",
        data
      );


      // =================================
      // Verification Success
      // =================================

      if (
        data.ok
      ) {


        result.innerHTML = `

          <b>
            ✅ Telegram User Verified
          </b>

          <br><br>

          <b>
            Advertisement:
          </b>

          SUCCESS ✅

          <br><br>

          <b>
            Telegram User Information
          </b>

          <br>

          ID:
          ${data.user.id}

          <br>

          Name:
          ${data.user.first_name || ""}

          ${data.user.last_name || ""}

          <br>

          Username:

          ${
            data.user.username
              ? "@" +
                data.user.username
              : "নেই"
          }

        `;


      }

      // =================================
      // Verification Failed
      // =================================

      else {


        result.innerHTML = `

          <b>
            ❌ Telegram Verification Failed
          </b>

          <br><br>

          ${data.error}

        `;

      }


    }

    catch (error) {


      console.error(
        "ERROR:",
        error
      );


      result.innerHTML = `

        ❌ Error

        <br><br>

        Google Apps -এর
        সঙ্গে যোগাযোগ করা যায়নি।

        <br><br>

        ${error.message}

      `;

    }


    // Enable button again

    button.disabled =
      false;


  }

);

</script>


</body>

</html>
