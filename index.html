<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>RichAds Test</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- RichAds -->
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .box {
      max-width: 450px;
      margin: 50px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      border: none;
      border-radius: 12px;
      background: #2196f3;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎁 Advertisement Test</h1>

  <p>
    নিচের button চাপলে একটি RichAds video advertisement চালু হবে।
  </p>

  <button id="ad-button">
    ▶️ Watch Advertisement
  </button>

  <div id="result">
    এখনো কোনো advertisement চালানো হয়নি।
  </div>

</div>

<script>

  // Telegram Mini App
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  // ============================
  // RichAds Controller
  // ============================

  const richadsController =
    new window.TelegramAdsController();


  richadsController.initialize({
    pubId: "994979",
    appId: "8875",
    debug: false
  });


  // ============================
  // Advertisement Button
  // ============================

  const button =
    document.getElementById("ad-button");

  const result =
    document.getElementById("result");


  button.addEventListener("click", async () => {

    button.disabled = true;

    result.innerText =
      "⏳ Advertisement চালু হচ্ছে...";

    try {

      const adResult =
        await richadsController.triggerInterstitialVideo();

      console.log("RichAds SUCCESS:", adResult);

      result.innerText =
        "✅ Advertisement result পাওয়া গেছে:\n\n" +
        JSON.stringify(adResult);

    } catch (error) {

      console.log("RichAds ERROR:", error);

      result.innerText =
        "❌ Advertisement result পাওয়া যায়নি:\n\n" +
        JSON.stringify(error);

    }

    button.disabled = false;

  });

</script>

</body>
</html>
